name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matlab:
    name: MATLAB verification suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          products: |
            Optimization_Toolbox
            Control_System_Toolbox
            Model_Predictive_Control_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: results = runtests('tests/matlab'); disp(table(results)); assertSuccess(results);

  python:
    name: MuJoCo model checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: pytest -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tumbling-target-capture .
      - run: docker run --rm tumbling-target-capture
      - run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" tumbling-target-capture python python/gnc/demo.py /out/demo.png
          test -s out/demo.png
